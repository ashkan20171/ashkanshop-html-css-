<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جزئیات محصول | Ashkan Shop</title><meta name="description" content="جزئیات محصول، مشخصات، امتیازها و محصولات پیشنهادی در اشکان‌شاپ"><link rel="canonical" href="product.html"><link rel="stylesheet" href="style/style.css"><link rel="stylesheet" href="style/pages.css"><link rel="stylesheet" href="style/product-page.css"><link rel="icon" href="images/ashkan-logo.svg"></head><body><header class="site-header"><div class="container header-inner"><a href="index.html" class="brand"><img src="images/ashkan-logo.svg" alt="Ashkan Shop"><span>ASHKAN<span>SHOP</span></span></a><nav><a href="index.html">فروشگاه</a><a href="blog.html">مجله</a><a href="about.html">درباره ما</a><a href="contact.html">تماس با ما</a></nav><a class="header-cart" href="index.html#products">بازگشت به فروشگاه</a></div></header><main class="container product-page"><div class="breadcrumbs"><a href="index.html">خانه</a><span>›</span><span>محصول</span></div><div id="productRoot"></div><section class="product-tabs"><button class="active" data-tab="desc">توضیحات</button><button data-tab="spec">مشخصات</button><button data-tab="reviews">نظرات کاربران</button><div id="tabContent"></div></section><section><div class="section-heading"><div><span class="section-kicker">پیشنهاد هوشمند</span><h2>محصولات مشابه</h2></div></div><div class="mini-product-grid" id="related"></div></section></main><footer class="footer"><div class="container footer-bottom"><span>© ۱۴۰۵ اشکان‌شاپ</span><a href="index.html">بازگشت به فروشگاه</a></div></footer><script src="products.json" type="application/json" id="productData"></script><script>const products=JSON.parse(document.getElementById('productData').textContent);const id=Number(new URLSearchParams(location.search).get('id'))||1;const p=products.find(x=>x.id===id)||products[0];document.title=p.name+' | Ashkan Shop';document.querySelector('meta[name=description]').content=`خرید ${p.name} با مشاهده قیمت، امتیاز، مشخصات و محصولات مشابه در اشکان‌شاپ.`;const fmt=n=>new Intl.NumberFormat('fa-IR').format(n);const root=document.querySelector('#productRoot');root.innerHTML=`<article class="product-detail"><div class="gallery"><div class="gallery-badge">${p.discount?'پیشنهاد ویژه':'انتخاب محبوب'}</div><img src="${p.image}" alt="${p.name}"></div><div class="detail-info"><span class="product-category">${p.categoryName}</span><h1>${p.name}</h1><div class="detail-rating">★★★★★ <span>${fmt(p.rating)} از ۵ · ${fmt(p.reviews)} نظر</span></div><p class="lead">انتخابی کاربردی و محبوب با طراحی جذاب، تجربه کاربری مناسب و ارزش خرید قابل توجه.</p><div class="detail-price">${p.oldPrice?`<del>${fmt(p.oldPrice)} تومان</del>`:''}<strong>${fmt(p.price)}</strong> تومان</div><div class="benefits"><span>✓ ضمانت سلامت کالا</span><span>✓ ارسال سریع</span><span>✓ امکان پیگیری سفارش</span></div><div class="detail-actions"><button class="primary-btn" id="add">افزودن به سبد خرید</button><button class="outline-btn" id="fav">♡ علاقه‌مندی</button><button class="outline-btn" id="compare">مقایسه</button></div></div></article>`;const tabs={desc:'این محصول برای استفاده روزمره طراحی شده و اطلاعات آن در نسخه Front-end به‌صورت نمایشی ارائه می‌شود. در نسخه متصل به Backend می‌توان موجودی، مشخصات دقیق و محتوای واقعی را از پایگاه داده دریافت کرد.',spec:`دسته‌بندی: ${p.categoryName}<br>امتیاز: ${p.rating} از ۵<br>تعداد نظرات: ${fmt(p.reviews)}<br>وضعیت: موجود در انبار`,reviews:`امتیاز کاربران ${p.rating} از ۵ است. ${fmt(p.reviews)} نظر برای این محصول ثبت شده است. در نسخه بعدی می‌توان فرم ثبت نظر، عکس و رأی مفید بودن نظر را نیز به Backend متصل کرد.`};const tc=document.querySelector('#tabContent');function tab(k){tc.innerHTML='<p>'+tabs[k]+'</p>'}tab('desc');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab(b.dataset.tab)});let cart=JSON.parse(localStorage.getItem('ashkan-cart')||'[]'),fav=JSON.parse(localStorage.getItem('ashkan-favorites')||'[]'),cmp=JSON.parse(localStorage.getItem('ashkan-compare')||'[]');document.querySelector('#add').onclick=()=>{let x=cart.find(i=>i.id===p.id);x?x.qty++:cart.push({id:p.id,qty:1});localStorage.setItem('ashkan-cart',JSON.stringify(cart));alert('محصول به سبد خرید اضافه شد.');};document.querySelector('#fav').onclick=()=>{fav=fav.includes(p.id)?fav.filter(x=>x!==p.id):[...fav,p.id];localStorage.setItem('ashkan-favorites',JSON.stringify(fav));document.querySelector('#fav').textContent=fav.includes(p.id)?'♥ در علاقه‌مندی‌ها':'♡ علاقه‌مندی';};document.querySelector('#compare').onclick=()=>{if(!cmp.includes(p.id)&&cmp.length<4)cmp.push(p.id);localStorage.setItem('ashkan-compare',JSON.stringify(cmp));alert('به مقایسه اضافه شد.');};document.querySelector('#related').innerHTML=products.filter(x=>x.category===p.category&&x.id!==p.id).slice(0,4).map(x=>`<a class="mini-product" href="product.html?id=${x.id}"><img src="${x.image}" alt="${x.name}"><b>${x.name}</b><span>${fmt(x.price)} تومان</span></a>`).join('');</script></body></html>
