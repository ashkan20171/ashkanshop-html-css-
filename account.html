<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب کاربری | Ashkan Shop</title><link rel="stylesheet" href="style/style.css"><link rel="stylesheet" href="style/pages.css"><style>.account{padding:50px 0}.account-grid{display:grid;grid-template-columns:280px 1fr;gap:25px}.account-nav,.account-card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 35px rgba(0,0,0,.06)}.account-nav a{display:block;padding:14px;border-radius:12px}.account-nav a:hover{background:#f5f6f8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{padding:20px;background:#f7f8fa;border-radius:16px}.stat b{display:block;font-size:26px;margin-top:8px}@media(max-width:700px){.account-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}</style></head><body><main class="container account"><div class="section-heading"><div><span class="section-kicker">پنل مشتری</span><h1>حساب کاربری</h1></div><a class="primary-btn" href="index.html">فروشگاه</a></div><div class="account-grid"><aside class="account-nav"><h3>دسترسی سریع</h3><a href="account.html">داشبورد</a><a href="tracking.html">پیگیری سفارش</a><a href="index.html#products">خرید محصولات</a><a href="faq.html">پشتیبانی</a></aside><section class="account-card"><h2>خوش آمدید 👋</h2><p>این پنل در نسخه Front-end نمایشی است و آماده اتصال به سیستم احراز هویت واقعی است.</p><div class="stats"><div class="stat">سبد خرید<b id="cart">۰</b></div><div class="stat">علاقه‌مندی<b id="fav">۰</b></div><div class="stat">بازدید اخیر<b id="recent">۰</b></div></div></section></div></main><script>const n=k=>JSON.parse(localStorage.getItem(k)||'[]').length;document.querySelector('#cart').textContent=new Intl.NumberFormat('fa-IR').format(JSON.parse(localStorage.getItem('ashkan-cart')||'[]').reduce((a,x)=>a+x.qty,0));document.querySelector('#fav').textContent=new Intl.NumberFormat('fa-IR').format(n('ashkan-favorites'));document.querySelector('#recent').textContent=new Intl.NumberFormat('fa-IR').format(n('ashkan-recent'));</script></body></html>
