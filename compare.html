<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقایسه محصولات | Ashkan Shop</title><link rel="stylesheet" href="style/style.css"><link rel="stylesheet" href="style/pages.css"><style>.compare-page{padding:45px 0}.compare-wrap{overflow:auto;background:#fff;border-radius:20px;padding:18px}.compare-table{width:100%;border-collapse:collapse;min-width:700px}.compare-table th,.compare-table td{padding:18px;border-bottom:1px solid #eee;text-align:center}.compare-table img{width:130px;height:130px;object-fit:contain}.compare-empty{text-align:center;padding:80px}</style></head><body><main class="container compare-page"><div class="section-heading"><div><span class="section-kicker">انتخاب آگاهانه</span><h1>مقایسه محصولات</h1></div><a class="primary-btn" href="index.html">بازگشت</a></div><div id="root"></div></main><script id="data" type="application/json"></script><script>fetch('products.json').then(r=>r.json()).then(ps=>{const ids=JSON.parse(localStorage.getItem('ashkan-compare')||'[]');const list=ids.map(id=>ps.find(p=>p.id===id)).filter(Boolean);const root=document.querySelector('#root');if(!list.length){root.innerHTML='<div class="compare-empty"><h2>محصولی برای مقایسه انتخاب نشده</h2><p>از فروشگاه تا ۴ محصول را برای مقایسه اضافه کنید.</p></div>';return}root.innerHTML='<div class="compare-wrap"><table class="compare-table"><tr><th>ویژگی</th>'+list.map(p=>`<th><img src="${p.image}" alt="${p.name}"><br>${p.name}</th>`).join('')+'</tr><tr><td>قیمت</td>'+list.map(p=>`<td>${new Intl.NumberFormat('fa-IR').format(p.price)} تومان</td>`).join('')+'</tr><tr><td>امتیاز</td>'+list.map(p=>`<td>⭐ ${p.rating}</td>`).join('')+'</tr><tr><td>نظرات</td>'+list.map(p=>`<td>${p.reviews}</td>`).join('')+'</tr><tr><td>دسته‌بندی</td>'+list.map(p=>`<td>${p.categoryName}</td>`).join('')+'</tr></table></div>'})</script></body></html>
